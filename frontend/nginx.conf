server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (CV, diplômes, justificatifs PDF) : autoriser des corps volumineux.
    client_max_body_size 50m;

    # API : relais vers le backend NestJS via le réseau interne Docker.
    # Le frontend appelle "/api/..." (même origine que la page) ; nginx réécrit
    # vers le backend. Avantage : aucune IP figée au build, pas de souci CORS —
    # quel que soit l'IP:port par lequel un testeur ouvre l'appli, ça marche.
    location /api/ {
        # Résolution DNS « à la volée » via le resolver interne de Docker
        # (127.0.0.11) : sans ça, nginx tente de résoudre "backend" au démarrage
        # et CRASHE si le conteneur backend n'est pas encore joignable
        # (« host not found in upstream "backend" »). Avec une variable + resolver,
        # la résolution se fait à chaque requête, donc plus de crash au boot.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $kiama_backend backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$kiama_backend:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Scoring / collecte peuvent être longs ; et le chat peut streamer.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA React Router : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés (hash dans le nom de fichier).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
